version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install --upgrade pip
      - pip install -r requirements.txt
  pre_build:
    commands:
      - echo "Ejecutando pruebas unitarias..."
      - PYTHONPATH=. pytest test/ -v
  build:
    commands:
      - echo "Compilación e inspección completadas."

artifacts:
  files:
    - '**/*'
